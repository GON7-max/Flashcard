<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation & Modelling — Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–navy:   #1F3864;
–blue:   #2E5C8E;
–sky:    #5B9BD5;
–pale:   #D6E4F0;
–mint:   #E8F5EE;
–green:  #1A6B2A;
–white:  #FFFFFF;
–off:    #F7F9FC;
–gray:   #4A5568;
–light:  #A0AEC0;
–border: #E2E8F0;
–card-h: 340px;
}

body {
font-family: ‘Inter’, sans-serif;
background: var(–off);
color: var(–gray);
min-height: 100vh;
}

/* ── HEADER ── */
header {
background: var(–navy);
padding: 20px 32px;
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 12px;
}
.header-title {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 1.25rem;
font-weight: 700;
color: var(–white);
letter-spacing: -0.02em;
}
.header-title span { color: var(–sky); }
.header-meta {
font-size: 0.8rem;
color: var(–pale);
opacity: 0.8;
}

/* ── CHAPTER TABS ── */
.tabs-wrap {
background: var(–navy);
padding: 0 32px 0;
display: flex;
gap: 4px;
overflow-x: auto;
scrollbar-width: none;
border-bottom: 3px solid var(–blue);
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.78rem;
font-weight: 600;
color: var(–pale);
padding: 10px 16px;
cursor: pointer;
border-radius: 6px 6px 0 0;
white-space: nowrap;
transition: background 0.2s, color 0.2s;
letter-spacing: 0.01em;
border: none;
background: transparent;
}
.tab:hover { background: rgba(255,255,255,0.08); color: var(–white); }
.tab.active { background: var(–off); color: var(–navy); }

/* ── MAIN AREA ── */
main {
max-width: 800px;
margin: 0 auto;
padding: 36px 24px 60px;
}

/* ── PROGRESS ── */
.progress-row {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 20px;
gap: 16px;
}
.progress-bar-wrap {
flex: 1;
height: 6px;
background: var(–border);
border-radius: 99px;
overflow: hidden;
}
.progress-bar {
height: 100%;
background: linear-gradient(90deg, var(–blue), var(–sky));
border-radius: 99px;
transition: width 0.4s ease;
}
.progress-label {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.82rem;
font-weight: 600;
color: var(–blue);
white-space: nowrap;
}

/* ── CARD ── */
.card-scene {
perspective: 1200px;
width: 100%;
min-height: var(–card-h);
cursor: pointer;
margin-bottom: 28px;
}
.card-inner {
position: relative;
width: 100%;
min-height: var(–card-h);
transform-style: preserve-3d;
transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
}
.card-scene.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
position: absolute;
width: 100%;
min-height: var(–card-h);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
border-radius: 16px;
padding: 36px 40px;
display: flex;
flex-direction: column;
}

/* FRONT — question */
.card-front {
background: var(–navy);
color: var(–white);
border: none;
justify-content: center;
align-items: center;
text-align: center;
}
.card-front .card-label {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.7rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–sky);
margin-bottom: 20px;
}
.card-front .card-q {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 1.35rem;
font-weight: 600;
line-height: 1.45;
color: var(–white);
max-width: 560px;
}
.card-front .flip-hint {
position: absolute;
bottom: 20px;
right: 24px;
font-size: 0.72rem;
color: rgba(255,255,255,0.35);
display: flex;
align-items: center;
gap: 5px;
}
.flip-icon { font-size: 0.9rem; }

/* BACK — answer */
.card-back {
background: var(–white);
border: 2px solid var(–border);
transform: rotateY(180deg);
justify-content: flex-start;
}
.card-back .card-label {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.7rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–green);
margin-bottom: 16px;
}
.card-back .answer-prose {
font-size: 0.95rem;
line-height: 1.65;
color: var(–gray);
margin-bottom: 12px;
}
.card-back ul {
list-style: none;
padding: 0;
margin: 0;
display: flex;
flex-direction: column;
gap: 7px;
}
.card-back ul li {
display: flex;
gap: 10px;
font-size: 0.9rem;
line-height: 1.55;
color: var(–gray);
}
.card-back ul li::before {
content: “•”;
color: var(–blue);
font-weight: 700;
flex-shrink: 0;
margin-top: 1px;
}
.card-back ul li strong {
color: var(–navy);
font-weight: 600;
}

/* ── NAV CONTROLS ── */
.controls {
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
}
.btn {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.85rem;
font-weight: 600;
padding: 10px 22px;
border-radius: 8px;
border: none;
cursor: pointer;
transition: all 0.18s;
letter-spacing: 0.01em;
}
.btn-prev {
background: var(–white);
color: var(–navy);
border: 2px solid var(–border);
}
.btn-prev:hover { border-color: var(–blue); color: var(–blue); }
.btn-next {
background: var(–navy);
color: var(–white);
}
.btn-next:hover { background: var(–blue); }
.btn-shuffle {
background: var(–pale);
color: var(–navy);
}
.btn-shuffle:hover { background: var(–sky); color: var(–white); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── SCORE BADGES ── */
.score-row {
display: flex;
justify-content: center;
gap: 10px;
margin-top: 22px;
flex-wrap: wrap;
}
.score-badge {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.78rem;
font-weight: 600;
padding: 5px 14px;
border-radius: 99px;
cursor: pointer;
border: none;
transition: all 0.18s;
}
.badge-know   { background: #C6F6D5; color: #22543D; }
.badge-know:hover   { background: #9AE6B4; }
.badge-review { background: #FED7D7; color: #742A2A; }
.badge-review:hover { background: #FEB2B2; }
.badge-counts { background: var(–border); color: var(–gray); cursor: default; }

/* ── CHAPTER TITLE ── */
.chapter-title {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 0.78rem;
font-weight: 600;
color: var(–light);
text-align: center;
margin-bottom: 10px;
letter-spacing: 0.03em;
text-transform: uppercase;
}

/* ── COMPLETION ── */
.done-banner {
display: none;
text-align: center;
padding: 40px 24px;
background: var(–white);
border: 2px solid var(–border);
border-radius: 16px;
margin-bottom: 28px;
}
.done-banner.show { display: block; }
.done-banner h2 {
font-family: ‘Space Grotesk’, sans-serif;
font-size: 1.6rem;
color: var(–navy);
margin-bottom: 8px;
}
.done-banner p { color: var(–gray); font-size: 0.95rem; }

@media (max-width: 540px) {
main { padding: 20px 14px 48px; }
.card-face { padding: 28px 22px; }
.card-front .card-q { font-size: 1.1rem; }
header { padding: 16px 20px; }
.tabs-wrap { padding: 0 16px; }
}

@media (prefers-reduced-motion: reduce) {
.card-inner { transition: none; }
}
</style>

</head>
<body>

<header>
  <div class="header-title">Simulation &amp; <span>Modelling</span></div>
  <div class="header-meta">Click a card to reveal the answer</div>
</header>

<div class="tabs-wrap" id="tabs"></div>

<main>
  <div class="progress-row">
    <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="progress-label" id="plabel"></div>
  </div>

  <div class="chapter-title" id="chTitle"></div>

  <div class="card-scene" id="cardScene" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front" id="cardFront">
        <div class="card-label">Question</div>
        <div class="card-q" id="cardQ"></div>
        <div class="flip-hint"><span class="flip-icon">↩</span> tap to reveal</div>
      </div>
      <div class="card-face card-back" id="cardBack">
        <div class="card-label">Answer</div>
        <div id="cardA"></div>
      </div>
    </div>
  </div>

  <div class="done-banner" id="doneBanner">
    <h2>🎉 Chapter complete!</h2>
    <p>You've gone through all cards in this chapter. Shuffle or pick another chapter.</p>
  </div>

  <div class="controls">
    <button class="btn btn-prev" id="btnPrev" onclick="prevCard()">← Prev</button>
    <button class="btn btn-shuffle" onclick="shuffleCards()">⇄ Shuffle</button>
    <button class="btn btn-next" id="btnNext" onclick="nextCard()">Next →</button>
  </div>

  <div class="score-row">
    <button class="score-badge badge-know" onclick="markCard('know')">✓ Got it</button>
    <button class="score-badge badge-review" onclick="markCard('review')">↺ Review again</button>
    <span class="score-badge badge-counts" id="scoreCounts"></span>
  </div>
</main>

// ── STATE ────────────────────────────────────────────────────────────────────
const chapters = [...new Set(DATA.map(d => d.ch))];
let activeChapter = 0; // 0 = all
let deck = [];
let idx = 0;
let flipped = false;
let scores = {}; // cardKey -> 'know' | 'review'

function cardKey(card) { return card.ch + '|' + card.q; }

function buildDeck() {
  const src = activeChapter === 0 ? DATA : DATA.filter(d => d.ch === activeChapter);
  deck = [...src];
  idx = 0;
  flipped = false;
}

function renderTabs() {
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tab' + (activeChapter === 0 ? ' active' : '');
  all.textContent = 'All';
  all.onclick = () => { activeChapter = 0; buildDeck(); render(); };
  wrap.appendChild(all);
  chapters.forEach(c => {
    const t = document.createElement('button');
    t.className = 'tab' + (activeChapter === c ? ' active' : '');
    t.textContent = 'Ch ' + c;
    t.onclick = () => { activeChapter = c; buildDeck(); render(); };
    wrap.appendChild(t);
  });
}

function render() {
  renderTabs();

  const scene = document.getElementById('cardScene');
  const done  = document.getElementById('doneBanner');

  if (idx >= deck.length) {
    scene.style.display = 'none';
    done.classList.add('show');
    document.getElementById('pbar').style.width = '100%';
    document.getElementById('plabel').textContent = deck.length + ' / ' + deck.length;
    document.getElementById('chTitle').textContent = '';
    document.getElementById('btnNext').disabled = true;
    document.getElementById('btnPrev').disabled = idx === 0;
    renderScore();
    return;
  }

  scene.style.display = 'block';
  done.classList.remove('show');

  const card = deck[idx];

  // progress
  const pct = deck.length > 1 ? (idx / (deck.length - 1)) * 100 : 100;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = (idx + 1) + ' / ' + deck.length;
  document.getElementById('chTitle').textContent = card.chTitle;

  // question
  document.getElementById('cardQ').textContent = card.q;

  // answer
  const ans = document.getElementById('cardA');
  ans.innerHTML = '';
  if (card.prose) {
    const p = document.createElement('div');
    p.className = 'answer-prose';
    p.textContent = card.prose;
    ans.appendChild(p);
  }
  if (card.prose2) {
    const p = document.createElement('div');
    p.className = 'answer-prose';
    p.textContent = card.prose2;
    ans.appendChild(p);
  }
  if (card.bullets) {
    const ul = document.createElement('ul');
    card.bullets.forEach(b => {
      const li = document.createElement('li');
      li.innerHTML = b;
      ul.appendChild(li);
    });
    ans.appendChild(ul);
  }

  // flip state
  if (flipped) {
    scene.classList.add('flipped');
  } else {
    scene.classList.remove('flipped');
  }

  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = false;

  renderScore();
}

function renderScore() {
  const know = Object.values(scores).filter(v => v === 'know').length;
  const review = Object.values(scores).filter(v => v === 'review').length;
  document.getElementById('scoreCounts').textContent =
    '✓ ' + know + '  ↺ ' + review;
}

function flipCard() {
  flipped = !flipped;
  const scene = document.getElementById('cardScene');
  if (flipped) scene.classList.add('flipped');
  else scene.classList.remove('flipped');
}

function nextCard() {
  if (idx < deck.length) {
    idx++;
    flipped = false;
    render();
  }
}

function prevCard() {
  if (idx > 0) {
    idx--;
    flipped = false;
    render();
  }
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
}

function markCard(type) {
  if (idx < deck.length) {
    scores[cardKey(deck[idx])] = type;
    renderScore();
  }
}

// keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevCard();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

// init
buildDeck();
render();
</script>
